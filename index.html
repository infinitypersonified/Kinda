<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d96c3b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kinda" />
    <meta name="description" content="A softer place to set your goals, find your focus, and grow alongside people who are trying too." />
    <title>Kinda — grow together</title>
    <script>try{var t=localStorage.getItem("kinda:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);var a=localStorage.getItem("kinda:accent");if(a&&a!=="terracotta")document.documentElement.setAttribute("data-accent",a)}catch(e){}</script>
    <style>
      .kinda-splash{display:grid;min-height:100vh;place-items:center;background:#faf8f5;color:#242424;font-family:"Manrope","DM Sans",system-ui,sans-serif}
      .kinda-splash-word{display:flex;align-items:baseline;font-size:clamp(52px,14vw,88px);font-weight:800;letter-spacing:-.05em;line-height:1}
      .kinda-splash-word i{display:inline-block;font-style:normal;opacity:0;animation:kl-rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms)}
      .kinda-splash-dot{color:#d96c3b;animation:kl-drop .85s cubic-bezier(.2,.9,.3,1) 600ms both,kl-pulse 1.8s ease-in-out 1.6s infinite!important}
      @keyframes kl-rise{from{opacity:0;transform:translateY(.55em);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
      @keyframes kl-drop{0%{opacity:0;transform:translateY(-1.1em) scale(.6,1.4)}55%{opacity:1;transform:translateY(0) scale(1.25,.7)}75%{opacity:1;transform:translateY(-.18em) scale(.95,1.05)}100%{opacity:1;transform:none}}
      @keyframes kl-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
      html[data-theme=dark] .kinda-splash{background:#161412;color:#efeae4}
      @media (prefers-color-scheme:dark){:root:not([data-theme=light]) .kinda-splash{background:#161412;color:#efeae4}}
    </style>
  </head>
  <body>
    <div id="root"><div class="kinda-splash" role="status" aria-label="Loading Kinda"><div class="kinda-splash-word" aria-hidden="true"><i style="--i:0">k</i><i style="--i:1">i</i><i style="--i:2">n</i><i style="--i:3">d</i><i style="--i:4">a</i><i class="kinda-splash-dot" style="--i:5">.</i></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
